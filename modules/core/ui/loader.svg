<svg class="ln-logo" xmlns="http://www.w3.org/2000/svg" viewBox="100 120 1071 1046" role="img" aria-label="Carregando">
<style>
  .ln-b{animation:ln-focus 2.4s cubic-bezier(.65,0,.35,1) infinite}
  .ln-tl{--x:-18px;--y:-18px}.ln-tr{--x:18px;--y:-18px}
  .ln-bl{--x:-18px;--y:18px}.ln-br{--x:18px;--y:18px}
  @keyframes ln-focus{0%,100%{transform:translate(var(--x),var(--y))}45%,60%{transform:translate(0,0)}}

  .ln-scan{animation:ln-sweep 2.4s cubic-bezier(.45,0,.4,1) infinite}
  @keyframes ln-sweep{
    0%{transform:translateY(0);opacity:0}
    8%{opacity:1}
    82%{opacity:1}
    92%,100%{transform:translateY(680px);opacity:0}
  }

  .ln-s{opacity:.22;animation:ln-bar 2.4s ease-in-out infinite}
  .ln-s2{animation-delay:.25s}.ln-s3{animation-delay:.5s}
  @keyframes ln-bar{0%,8%{opacity:.22}22%,62%{opacity:1}82%,100%{opacity:.22}}

  @media (prefers-reduced-motion:reduce){
    .ln-b,.ln-s{animation:none;transform:none;opacity:1}
    .ln-scan{animation-duration:4s}
  }
</style>
<defs>
