  <linearGradient id="ln-trail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fd81a" stop-opacity="0"/><stop offset="1" stop-color="#5fd81a" stop-opacity=".32"/></linearGradient>
  <linearGradient id="ln-fade" gradientUnits="userSpaceOnUse" x1="195" y1="0" x2="1075" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".12" stop-color="#fff"/><stop offset=".88" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
